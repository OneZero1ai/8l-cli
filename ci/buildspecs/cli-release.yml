version: 0.2

# Build + publish the 8l operator CLI binary for all platforms to the
# 8th-Layer S3 release bucket. Runs in AWS CodeBuild — project
# `8l-cli-release`, account 124074140789, us-east-1.
#
# Trigger: a `v*` tag push, via the `8th-layer-github` CodeConnections
# webhook. Or manually:
#   aws codebuild start-build --project-name 8l-cli-release \
#     --source-version vX.Y.Z --profile 8th-layer-app --region us-east-1
#
# Artifacts land in:
#   s3://${RELEASE_BUCKET}/8l/vX.Y.Z/8l_{OS}_{ARCH}.tar.gz
#   s3://${RELEASE_BUCKET}/8l/vX.Y.Z/SHA256SUMS
#
# The `8l/` prefix keeps these artifacts separate from the cq CLI
# tarballs published by 8th-layer-agent's cli-release.yml (which use
# the `cli/` prefix — to be renamed to `cq/` in a follow-up). The
# unified installer at install.8th-layer.ai consumes both prefixes.
#
# Go is installed explicitly (go.mod pins a version newer than the
# CodeBuild image ships) so the build is reproducible regardless of
# image.

env:
  variables:
    RELEASE_BUCKET: 8l-cli-releases-124074140789-us-east-1
    GO_VERSION: 1.26.1

phases:
  install:
    commands:
      - curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
      - export PATH="/usr/local/go/bin:${PATH}"
      - go version
  build:
    commands:
      - |
        set -euo pipefail
        export PATH="/usr/local/go/bin:${PATH}"

        # Resolve the release version from the tag that triggered the build.
        REF="${CODEBUILD_WEBHOOK_TRIGGER:-}"
        case "$REF" in
          tag/v*) VER="${REF#tag/v}" ;;
          *)
            SV="${CODEBUILD_SOURCE_VERSION:-}"
            case "$SV" in
              v*) VER="${SV#v}" ;;
              *) echo "ERROR: not a v* tag build (trigger='$REF' source='$SV')"; exit 1 ;;
            esac
            ;;
        esac
        echo "Releasing 8l CLI v${VER}"

        SHA="$(git rev-parse --short HEAD)"
        DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        VP=github.com/OneZero1ai/8l-cli/pkg/version
        LD="-s -w -X ${VP}.Version=v${VER} -X ${VP}.Commit=${SHA} -X ${VP}.BuildDate=${DATE}"

        OUT="${CODEBUILD_SRC_DIR}/_dist"
        rm -rf "$OUT"; mkdir -p "$OUT"

        build_unix() {  # OS_label arch_label GOOS GOARCH
          GOOS="$3" GOARCH="$4" go build -ldflags "$LD" -o /tmp/8l ./cmd/8l
          tar -C /tmp -czf "${OUT}/8l_$1_$2.tar.gz" 8l && rm /tmp/8l
        }
        build_win() {   # arch_label GOARCH
          GOOS=windows GOARCH="$2" go build -ldflags "$LD" -o /tmp/8l.exe ./cmd/8l
          ( cd /tmp && zip -q "${OUT}/8l_Windows_$1.zip" 8l.exe ) && rm /tmp/8l.exe
        }

        build_unix Darwin arm64  darwin arm64
        build_unix Darwin x86_64 darwin amd64
        build_unix Linux  arm64  linux  arm64
        build_unix Linux  x86_64 linux  amd64
        build_win  x86_64 amd64
        build_win  arm64  arm64

        # SHA256SUMS lets the installer verify each tarball before extract.
        # Format is the standard `sha256sum`-compatible "HASH  FILE" pair.
        ( cd "$OUT" && sha256sum 8l_* > SHA256SUMS )
        ls -la "$OUT"
        cat "$OUT/SHA256SUMS"

        aws s3 cp "$OUT/" "s3://${RELEASE_BUCKET}/8l/v${VER}/" --recursive
        echo "Published 8l v${VER} -> s3://${RELEASE_BUCKET}/8l/v${VER}/"
